services:
  - type: web
    name: support-desk-capstone
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: WEEKLY_TOKEN
        generateValue: true
      - key: REVIEWER_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
